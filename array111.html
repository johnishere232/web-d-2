<html>
<head>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
body {background: lavender;}
h1, h3 {color: darkviolet;}
.box {background: white; color: darkviolet;}
</style>
</head>
<body>
<div class="container py-4">
    <h1 class="mb-1">my playlist sorter</h1>
    <p class="text-muted mb-4"> sort and label your playlist</p>
    <div class="card mb-4">
        <div class="card-body">
        <h3 class="card-title">song names</h3>
        <button class="btn btn-primary mr-2"
        onclick="sortAZ()">sort a to z</button>
        <button class="btn btn-primary" onclick="sortZA()">sort z to a</button>
        <div id="nameResult" class="box p-3 mt-3 rounded"></div>
        </div>
    </div>
    <div class="card mb-4"></div>
    <div class="card-body">
        <h3 class="card-title">play counts</h3>
        <button class="btn btn-primary mr-2"
        onclick="sortleast()">least played first</button>
        <button class="btn btn-primary" onclick="sortMost()">most played</button>
        <div id="countResult" class="box p-3 mt-3 rounded"></div>
        </div>
        </div>
        <div class="card mb-4"></div>
        </div>
        <div class="card-body">
        <h3 class="card-title">every play count</h3>
        <button class="btn btn-primary mr-2"
        onclick="addLabel()">add plays label</button>
        <div id="label" class="box p-3 mt-3 rounded"></div>
        </div>
    </div>
    
</div>
<script>
    var songs = ["zoom", "bounce", "glow", "rush", "spark", ]

    var plays = [ 320, 85, 210, 50, 175,]

    document.getElementById("nameResult").innerHTML = "Songs: " +
    songs;
     document.getElementById("countResult").innerHTML = "Plays: " +
    plays;
     document.getElementById("labelResult").innerHTML = "Press the button above!";

     function sortAZ()  {songs.sort();
     document.getElementById("nameResult").innerHTML = "A to Z: " +
     songs;}
     function sortZA()  {songs.sort();
     document.getElementById("nameResult").innerHTML = "Z to A: " +
     songs;}
     function sortLeast()  {plays.sort(function(a,b){return a-b});
     document.getElementById("countResult").innerHTML = "least played first" +
     plays;}
      function sortMost()  {plays.sort(function(a,b){return a-b});
     document.getElementById("countResult").innerHTML = "most played first" +
     plays;}
      function sortLeast()  {plays.map(function(c){return c+"plays"});
     document.getElementById("labelResult").innerHTML = "labelled:" + 1 }
</script>
</body>
</html>
